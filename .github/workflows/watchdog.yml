name: Watchdog

# Every half hour, check the live site's data is fresh. If it isn't, kick the "Update site"
# workflow. If it has been stale for over 4 hours this run fails, and GitHub emails you.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check freshness
        id: check
        env:
          SITE_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
        run: python scripts/watchdog.py
      - name: Re-trigger the update
        if: always() && steps.check.outputs.stale == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --repo "${{ github.repository }}"
